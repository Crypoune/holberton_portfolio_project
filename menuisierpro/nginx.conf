# --- nginx.conf ---
# À adapter selon ton hébergeur (certains, comme Render/Railway, gèrent Nginx
# et le TLS pour toi automatiquement — regarde d'abord si ton hébergeur le
# fait déjà avant de déployer ça toi-même).

server {
    listen 80;
    server_name menuisierpro.example.com;

    # Redirection automatique vers https une fois le certificat en place.
    # Décommente une fois Certbot configuré (voir section SSL plus bas).
    # return 301 https://$host$request_uri;

    # --- Fichiers statiques (CSS, JS, admin Django) ---
    # Nginx les sert directement depuis le disque : c'est 10 à 100x plus
    # rapide que de faire passer chaque .css par le processus Python.
    location /static/ {
        alias /app/.dist/static/;
        expires 30d;
    }

    # --- Fichiers média (photos de chantiers uploadées) ---
    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # --- Tout le reste part vers Gunicorn ---
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        # Ces deux en-têtes permettent à Django de savoir quelle est l'IP
        # réelle du visiteur et le protocole d'origine (http/https), utile
        # pour SECURE_PROXY_SSL_HEADER dans settings.py.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Limite la taille des uploads (photos de chantier) à 10 Mo, sinon Nginx
    # refuse la connexion pour tout ce qui dépasse — pratique pour éviter
    # qu'un visiteur mal intentionné n'envoie un fichier de plusieurs Go.
    client_max_body_size 10M;
}
