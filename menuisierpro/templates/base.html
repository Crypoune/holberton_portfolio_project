<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Gepetto's House - Avis Client{% endblock %}</title>
  {% load static %}
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="{% static 'menuisier/style.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo">
        <span class="logo__wood">🪵</span>
        <span class="logo__text">GEPETTO'S <span class="logo__highlight">HOUSE</span></span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-main">
      {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>© 2026 Gepetto's House — Tous droits réservés.</p>
      <p class="app-footer__sub">Atelier de Menuiserie & Charpente — Madagascar</p>
    </footer>
  </div>
  {% block extra_js %}{% endblock %}
</body>
</html>
